name: Prepare regional type correction
on:
  push:
    branches: [fix/region-label-type-no-captions-20261113]
    paths: [.github/workflows/prepare-region-type.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update only the rejected visual caption contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/test_market_width_browser.mjs')
          s=p.read_text()
          pairs=[
            ("assert.equal(quality.ranges.length,2,'both exact date ranges are disclosed outside the regular axes');", "assert.equal(quality.ranges.length,0,'unrequested range captions are absent from both charts');"),
            ("assert.match(await tomorrowPage.locator('#dist .chart-date-range').textContent(),/13 Nov 2026/,'the exact range advances with the newly published data');", "assert.equal(await tomorrowPage.locator('#dist .chart-date-range').count(),0,'new publications must not reintroduce rejected range captions');")
          ]
          for before,after in pairs:
              assert s.count(before)==1,before
              s=s.replace(before,after)
          p.write_text(s)
          PY
          node --check scripts/test_market_width_browser.mjs
          node --test scripts/test_startup_date_scope.mjs scripts/test_calendar_axes.mjs scripts/test_frontend_resilience.mjs scripts/test_startup_loading.mjs
      - name: Commit verified regression correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test_market_width_browser.mjs
          git diff --cached --check
          git commit -m 'Assert removed range captions stay absent, retaining date cadence and rollover checks'
          git push origin HEAD:fix/region-label-type-no-captions-20261113
