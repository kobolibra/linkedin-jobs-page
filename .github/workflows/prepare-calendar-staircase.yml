name: Prepare calendar staircase refinement
on:
  push:
    branches: [fix/calendar-axes-region-staircase-20261113]
    paths: [.github/workflows/prepare-calendar-staircase.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exactly the locally verified edits with before and after hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, base64, zlib, hashlib
          encoded = ''''''
          # Correct a transcription-only payload segment before checking its digest.
          encoded=encoded.replace('YdtjcpRvT2s+us3','YdtjcpRvT2s+us3')
          encoded=encoded.replace('YUdtjcpRvT2s+us3','YUdtjcpRvT2s+us3')
          raw=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '036c755726814b1d4483577822da387f823338e6a5d178468d0753ee42e1fcdc'
          payload=json.loads(raw)
          for item in payload['files']:
              p=Path(item['path']);text=p.read_text()
              assert hashlib.sha256(text.encode()).hexdigest()==item['before'], f'Unexpected source: {p}'
              lines=text.splitlines(keepends=True)
              for start,end,value in reversed(item['edits']): lines[start:end]=[value]
              updated=''.join(lines)
              assert hashlib.sha256(updated.encode()).hexdigest()==item['after'], f'Unexpected result: {p}'
              p.write_text(updated)
          p=Path('scripts/test_homepage_startup.mjs');raw=p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='e239bd2dc9575774aa6ae7d66e628e18d875c30e'
          text=raw.decode()
          for before,after in payload['startup_replacements']:
              assert text.count(before)==1, before
              text=text.replace(before,after)
          p.write_text(text)
          PY
          node --check app.js
          node --check scripts/test_homepage_startup.mjs
          node --test scripts/test_startup_date_scope.mjs scripts/test_frontend_resilience.mjs scripts/test_startup_loading.mjs
      - name: Commit only the seven scoped files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles-refinement.css scripts/test_frontend_resilience.mjs scripts/test_market_width_browser.mjs scripts/test_startup_date_scope.mjs scripts/test_homepage_startup.mjs
          git diff --cached --check
          git --no-pager diff --cached --stat
          git commit -m 'Use regular calendar axes and clearly stepped regional measure-label pairs'
          git push origin HEAD:fix/calendar-axes-region-staircase-20261113
