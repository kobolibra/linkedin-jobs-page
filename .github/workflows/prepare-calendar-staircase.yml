name: Prepare calendar staircase refinement
on:
  push:
    branches: [fix/calendar-axes-region-staircase-20261113]
    paths: [.github/workflows/prepare-calendar-staircase.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-guarded locally tested edits
        run: |
          python scripts/patches/calendar_staircase.py
          node --check app.js
          node --check scripts/test_homepage_startup.mjs
          node --test scripts/test_startup_date_scope.mjs scripts/test_frontend_resilience.mjs scripts/test_startup_loading.mjs
      - name: Commit only scoped changes to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html styles-refinement.css scripts/test_frontend_resilience.mjs scripts/test_market_width_browser.mjs scripts/test_homepage_startup.mjs
          git diff --cached --check
          git --no-pager diff --cached --stat
          git commit -m 'Use regular calendar axes and clearly stepped regional measure-label pairs'
          git push origin HEAD:fix/calendar-axes-region-staircase-20261113
      - name: Retain exact source for independent full-browser verification
        uses: actions/upload-artifact@v4
        with:
          name: calendar-staircase-source
          path: |
            *.js
            *.mjs
            *.css
            *.html
            jobs-index.json
            jobs-version.json
            scripts/test_*.mjs
            scripts/guest_preview.mjs
            scripts/browser_assets.mjs
          retention-days: 3
