name: JobSpy history backfill

on:
  workflow_dispatch:
    inputs:
      results_per_company:
        description: "Maximum historical jobs to collect per company"
        required: false
        default: "1000"
        type: string
      detail_workers:
        description: "Parallel LinkedIn detail requests"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: jobspy-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LINKEDIN_HTTP_STATE: /tmp/linkedin-backfill-state.json
      LINKEDIN_HEALTH_EVENTS: /tmp/linkedin-backfill-events.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Initialize bounded shared request state
        run: |
          python scripts/jobspy/scraper_health.py --state data/jobspy/http-state.json --initialize-runtime "$LINKEDIN_HTTP_STATE"
          : > "$LINKEDIN_HEALTH_EVENTS"
          mkdir -p /tmp/linkedin-backfill-search
      - name: Fetch historical search results
        run: |
          mkdir -p data/jobspy/backfill
          python scripts/jobspy/fetch_linkedin_requests.py \
            --company "BNP Paribas" \
            --company "Societe Generale" \
            --company "DBS Bank" \
            --company "Deutsche Bank" \
            --company "Goldman Sachs" \
            --company "BlackRock" \
            --company "Bank of America" \
            --company "Fidelity International" \
            --results-per-company "${{ inputs.results_per_company }}" \
            --delay-min 2 \
            --delay-max 5 \
            --page-timeout 20 \
            --page-attempts 3 \
            --output /tmp/linkedin-backfill-search/search.json
      - name: Fetch historical JD details
        run: |
          python scripts/jobspy/fetch_details_parallel.py \
            --input /tmp/linkedin-backfill-search/search.json \
            --output /tmp/linkedin-backfill-details.json \
            --workers "${{ inputs.detail_workers }}" \
            --timeout 15 \
            --attempts 3 \
            --delay-min 1 \
            --delay-max 3
      - name: Filter and normalize historical baseline
        run: |
          python scripts/jobspy/audit_and_repair_baseline.py \
            --input /tmp/linkedin-backfill-details.json \
            --output data/jobspy/backfill/normalized.json \
            --retry-output data/jobspy/backfill/detail_retry.json \
            --report data/jobspy/backfill/report.json
      - name: Upload backfill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jobspy-history-backfill-${{ github.run_id }}
          path: data/jobspy/backfill/
          retention-days: 30
      - name: Commit historical baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/jobspy/backfill/normalized.json /tmp/linkedin-backfill.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python scripts/jobspy/publish_backfill.py --normalized /tmp/linkedin-backfill.json
            python scripts/posting_event_history.py
            python scripts/jobspy/build_frontend_payload.py --boilerplate data/jev-boilerplate.json
            python scripts/audit_project.py --strict
            git add jobs.json jobs-index.json jobs-details.json data/posting-events-ledger.json data/jev-boilerplate.json data/jobspy/jobspy_baseline_final_unified.json data/jobspy/*_f_c_*_final.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "jobspy: enrich historical employer data without resetting lifecycle"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo 'Unable to publish historical enrichment' >&2
          exit 1
      - name: Dispatch complete site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME"
      - name: Persist historical scraping health and cooldowns
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python scripts/jobspy/scraper_health.py --task jobs --workflow-status "$WORKFLOW_STATUS" --search-dir /tmp/linkedin-backfill-search --details /tmp/linkedin-backfill-details.json --snapshot /tmp/linkedin-backfill-health.json
          for attempt in 1 2 3 4 5; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            health_rc=0
            python scripts/jobspy/scraper_health.py --apply /tmp/linkedin-backfill-health.json --state data/jobspy/http-state.json || health_rc=$?
            if [[ "$health_rc" != 0 && "$health_rc" != 2 ]]; then exit "$health_rc"; fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/jobspy/health.json data/jobspy/http-state.json
            if git diff --cached --quiet; then exit "$health_rc"; fi
            git commit -m '[scraper-health] preserve backfill diagnostics and cooldowns'
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit "$health_rc"; fi
            sleep $((attempt * 3))
          done
          exit 1
