name: Lifecycle and JEV regression tests

on:
  pull_request:
    paths:
      - 'scripts/jobspy/**'
      - 'scripts/audit_project.py'
      - 'scripts/test_audit_project.py'
      - 'scripts/test_frontend_resilience.mjs'
      - 'scripts/test_public_asset_routes.mjs'
      - 'guestbook.js'
      - 'scripts/company_logos.py'
      - 'scripts/rss_publication.py'
      - 'scripts/test_rss_publication.py'
      - 'scripts/logo_http.py'
      - 'scripts/test_logo_http.py'
      - 'scripts/test_company_logos.py'
      - 'scripts/test_company_logos.mjs'
      - 'company-logos.js'
      - 'requirements-logos.txt'
      - 'requirements-jobspy.txt'
      - 'worker.js'
      - 'jev-taxonomy.mjs'
      - 'gen-taxonomy-doc.mjs'
      - 'jev-taxonomy-*.md'
      - 'test-jev-worker.mjs'
      - 'visitor-count.js'
      - 'wrangler.jsonc'
      - 'scripts/visitor-counter.mjs'
      - 'index.html'
      - 'app.js'
      - 'market-width.js'
      - 'market-width.css'
      - 'scripts/test_market_width.mjs'
      - 'scripts/test_market_width_browser.mjs'
      - 'account.js'
      - 'account-auth.mjs'
      - 'account-preferences.mjs'
      - 'account-sync.js'
      - 'scripts/test_account_sync.mjs'
      - 'auth-login.js'
      - 'auth.css'
      - 'login.html'
      - 'privacy.html'
      - 'migrations/**'
      - 'scripts/test_accounts.mjs'
      - 'list-query.js'
      - 'list-view.js'
      - 'job-store.js'
      - 'row-fixes.js'
      - 'salary-display.js'
      - 'styles-refinement.css'
      - 'job-applications.js'
      - 'job-applications.css'
      - 'scripts/test_job_applications.mjs'
      - 'scripts/test_application_journey_visual.mjs'
      - 'scripts/journey_palette_trials.mjs'
      - 'scripts/verify_application_assets.py'
      - 'scripts/test_verify_application_assets.py'
      - 'scripts/test_job_actions.mjs'
      - 'scripts/test_list_interaction.mjs'
      - 'scripts/build_jd_shards.mjs'
      - 'scripts/public_assets.mjs'
      - 'scripts/guest_preview.mjs'
      - 'scripts/browser_assets.mjs'
      - 'auth-guest.js'
      - 'auth-guest.css'
      - 'scripts/test_guest_preview.mjs'
      - 'scripts/test_guest_resume.mjs'
      - 'guest.js'
      - 'guest-resume.js'
      - 'guest.css'
      - 'login.html'
      - 'auth-login.js'
      - 'auth-login-design.css'
      - 'scripts/test_public_assets.mjs'
      - '.assetsignore'
      - 'scripts/sync_frontend_payloads.py'
      - 'scripts/test_sync_frontend_payloads.py'
      - 'scripts/test_jd_loading.mjs'
      - 'scripts/test_jev_framework.mjs'
      - 'package.json'
      - 'company-insight.js'
      - 'styles-company.css'
      - 'scripts/test_company_insight.mjs'
      - 'scripts/test_visitor_count.mjs'
      - 'scripts/verify_visitor_counter.py'
      - 'scripts/test_verify_visitor_counter.py'
      - 'scripts/deploy_cloudflare.py'
      - 'scripts/test_deploy_cloudflare.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
      - name: Audit the actual canonical data and cached logo assets
        run: python scripts/audit_project.py --strict
      - name: Test lifecycle and frontend payload generation
        env:
          PYTHONPATH: scripts/jobspy
        run: |
          python -m unittest discover -s scripts/jobspy -p 'test_*.py'
          python scripts/jobspy/jev_preprocess.py
          python scripts/jobspy/build_frontend_payload.py --self-test
      - name: Test company logo identity and cache publication
        run: |
          python -m pip install --disable-pip-version-check -r requirements-logos.txt
          PYTHONPATH=scripts python -m unittest scripts/test_company_logos.py scripts/test_logo_http.py scripts/test_rss_publication.py
          node --check company-logos.js
          node --test scripts/test_company_logos.mjs
      - name: Test JEV Worker and visitor counter
        run: |
          node --test scripts/test_market_width.mjs scripts/test_public_asset_routes.mjs scripts/test_guest_preview.mjs scripts/test_guest_resume.mjs scripts/test_accounts.mjs scripts/test_account_sync.mjs scripts/test_job_applications.mjs scripts/test_list_view.mjs scripts/test_list_query.mjs scripts/test_job_store.mjs scripts/test_row_hover.mjs scripts/test_cn_city_map.mjs scripts/test_frontend_resilience.mjs test-jev-worker.mjs scripts/test_visitor_count.mjs scripts/test_company_insight.mjs scripts/test_list_interaction.mjs scripts/test_job_actions.mjs scripts/test_jd_loading.mjs scripts/test_jev_framework.mjs
          python -m unittest discover -s scripts -p test_verify_visitor_counter.py
          python -m unittest discover -s scripts -p test_verify_application_assets.py
      - name: Check My Journey in headless Chromium across light, dark and mobile
        run: |
          npm install --ignore-scripts --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test_application_journey_visual.mjs
          node scripts/test_market_width_browser.mjs
      - name: Upload My Journey visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-sankey-browser-visuals
          path: artifacts/journey-visual
          if-no-files-found: ignore
      - name: Upload Market Width matrix visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-width-matrix-browser-visuals
          path: artifacts/market-width
          if-no-files-found: ignore
      - name: Verify publication excludes server code, private data and credentials
        run: |
          node --test scripts/test_public_assets.mjs
          node scripts/build_jd_shards.mjs
          node scripts/public_assets.mjs --check

      - name: Test transient deployment failures and retry budgets
        run: PYTHONPATH=scripts python -m unittest scripts/test_deploy_cloudflare.py scripts/test_audit_project.py scripts/test_sync_frontend_payloads.py


