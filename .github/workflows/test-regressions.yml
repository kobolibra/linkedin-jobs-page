name: Lifecycle and JEV regression tests

on:
  pull_request:
    paths:
      - 'scripts/jobspy/**'
      - 'requirements-jobspy.txt'
      - 'worker.js'
      - 'test-jev-worker.mjs'
      - 'visitor-count.js'
      - 'wrangler.jsonc'
      - 'scripts/visitor-counter.mjs'
      - 'scripts/test_visitor_counter_integration.py'
      - 'index.html'
      - 'scripts/test_visitor_count.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
      - name: Test lifecycle and frontend payload generation
        env:
          PYTHONPATH: scripts/jobspy
        run: |
          python -m unittest discover -s scripts/jobspy -p 'test_*.py'
          python scripts/jobspy/jev_preprocess.py
          python scripts/jobspy/build_frontend_payload.py --self-test
      - name: Test JEV Worker and visitor counter
        run: node --test test-jev-worker.mjs scripts/test_visitor_count.mjs
      - name: Test persistent visitor counter in Cloudflare runtime
        run: |
          npm install --no-save wrangler@4.143.0
          python scripts/test_visitor_counter_integration.py
