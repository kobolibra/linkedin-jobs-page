name: Lifecycle and JEV regression tests

on:
  pull_request:
    paths:
      - 'scripts/jobspy/**'
      - 'requirements-jobspy.txt'
      - 'worker.js'
      - 'jev-taxonomy.mjs'
      - 'gen-taxonomy-doc.mjs'
      - 'jev-taxonomy-*.md'
      - 'test-jev-worker.mjs'
      - 'visitor-count.js'
      - 'wrangler.jsonc'
      - 'scripts/visitor-counter.mjs'
      - 'index.html'
      - 'app.js'
      - 'row-fixes.js'
      - 'scripts/test_list_interaction.mjs'
      - 'scripts/build_jd_shards.mjs'
      - 'scripts/test_jd_loading.mjs'
      - 'scripts/test_jev_framework.mjs'
      - 'package.json'
      - 'company-insight.js'
      - 'styles-company.css'
      - 'scripts/test_company_insight.mjs'
      - 'scripts/test_visitor_count.mjs'
      - 'scripts/verify_visitor_counter.py'
      - 'scripts/test_verify_visitor_counter.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
      - name: Test lifecycle and frontend payload generation
        env:
          PYTHONPATH: scripts/jobspy
        run: |
          python -m unittest discover -s scripts/jobspy -p 'test_*.py'
          python scripts/jobspy/jev_preprocess.py
          python scripts/jobspy/build_frontend_payload.py --self-test
      - name: Test JEV Worker and visitor counter
        run: |
          node --test test-jev-worker.mjs scripts/test_visitor_count.mjs scripts/test_company_insight.mjs scripts/test_list_interaction.mjs scripts/test_jd_loading.mjs scripts/test_jev_framework.mjs
          python -m unittest discover -s scripts -p test_verify_visitor_counter.py
