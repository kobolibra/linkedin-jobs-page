name: Repair n8n incremental overwrite

on:
  push:
    branches: [main]
    paths: [jobs.json]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[n8n-repair]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect and merge legacy n8n array payload
        id: repair
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          current=json.load(open('jobs.json'))
          print('current_payload_type', type(current).__name__)
          if not isinstance(current, list):
              open('/tmp/needs-repair','w').write('no')
          else:
              open('/tmp/needs-repair','w').write('yes')
          PY
          if [ "$(cat /tmp/needs-repair)" = "no" ]; then
            echo "payload is already a lifecycle snapshot; no repair needed"
            echo "needs=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show HEAD^:jobs.json > /tmp/baseline.json
          python3 scripts/jobspy/merge_n8n_incremental.py \
            --baseline /tmp/baseline.json \
            --batch jobs.json \
            --output /tmp/repaired.json
          cp /tmp/repaired.json jobs.json
          echo "needs=true" >> "$GITHUB_OUTPUT"
      - name: Commit repaired lifecycle snapshot
        if: steps.repair.outputs.needs == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add jobs.json
          git commit -m "[n8n-repair] merge incremental feed into lifecycle snapshot"
          git push
