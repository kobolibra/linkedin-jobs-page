name: Prepare list date hotfix
on:
  push:
    branches: [fix/list-date-shadow-20261113]
    paths: [.github/workflows/prepare-list-date-hotfix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact date helper repair without altering chart calculations
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('app.js')
          raw = p.read_bytes()
          sha = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert sha == 'c72ada87a16e9991bc7c5e4da3fed3ce1e72d2d3', f'Unexpected app source: {sha}'
          s = raw.decode()
          start = s.index("    const regionTickFormat=new Intl.DateTimeFormat(")
          end = s.index('    const calendarCandidates=[];', start)
          axis = s[start:end]
          assert axis.count('dayLabel') == 4, 'Unexpected chart label call sites'
          axis = axis.replace('dayLabel', 'regionAxisDayLabel')
          axis = axis.replace('    const regionAxisDayLabel=', '    // Chart-only Date formatter must not shadow the ISO-safe job-list dayLabel.\n    const regionAxisDayLabel=')
          p.write_text(s[:start] + axis + s[end:])
          old = 'regional-axes-recovery-20261113'
          new = 'list-date-shadow-fix-20261113'
          for name, count in [('index.html', 2), ('scripts/test_frontend_resilience.mjs', 1)]:
              p = Path(name)
              s = p.read_text()
              assert s.count(old) == count, f'Unexpected asset references: {name}'
              p.write_text(s.replace(old, new))
          PY
          node --check app.js
          node --test scripts/test_startup_loading.mjs scripts/test_frontend_resilience.mjs scripts/test_list_interaction.mjs
      - name: Commit only the verified repair to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html scripts/test_frontend_resilience.mjs
          git diff --cached --check
          git --no-pager diff --cached --stat
          git commit -m 'Fix chart date helper shadowing job-list ISO formatter; refresh app asset version'
          git push origin HEAD:fix/list-date-shadow-20261113
      - name: Upload source for independent browser verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: list-date-hotfix-source
          path: |
            app.js
            index.html
            *.js
            *.mjs
            *.css
            *.html
            jobs-index.json
            jobs-version.json
            scripts/test_*.mjs
          retention-days: 3
