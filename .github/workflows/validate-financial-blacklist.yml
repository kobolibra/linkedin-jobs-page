name: Financial blacklist schema

on:
  pull_request:
    paths: [financial_blacklist.json, company_employer_types.json, reclassify.py, scripts/audit_employer_types.py, scripts/publication_state.py, data/publication-state.json, .github/workflows/validate-financial-blacklist.yml]
  push:
    branches: [main]
    paths: [financial_blacklist.json, company_employer_types.json, reclassify.py, scripts/audit_employer_types.py, scripts/publication_state.py, data/publication-state.json, .github/workflows/validate-financial-blacklist.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require typed company records and preserve verified history
        run: python scripts/publication_state.py --validate
      - name: Audit employer coverage from the protection list only
        run: |
          python scripts/audit_employer_types.py
          python scripts/audit_employer_types.py --pending > /tmp/employer-review-queue.json
      - name: Rank every employer by current homepage job count
        run: python scripts/audit_employer_types.py --ranked
