name: Financial blacklist schema

on:
  pull_request:
    paths: [financial_blacklist.json, company_employer_types.json, auto-daily-companies.py, reclassify.py, scripts/trae_bootstrap.py, scripts/trae_company_review.py, scripts/test_trae_company_review.py, scripts/apply_company_review.py, scripts/test_apply_company_review.py, scripts/test_agent_reclassification.py, reports/cumulative-target-companies.tsv, reports/cumulative-excluded-companies.tsv, company_industries.json, docs/trae-company-review.md, docs/financial-blacklist.md, scripts/jobspy/linkedin_ids.py, scripts/audit_employer_types.py, scripts/company_review_queue.py, scripts/test_company_review_queue.py, scripts/publication_state.py, reports/employer-review-status.json, data/publication-state.json, .github/workflows/validate-financial-blacklist.yml]
  push:
    branches: [main]
    paths: [financial_blacklist.json, company_employer_types.json, auto-daily-companies.py, reclassify.py, scripts/trae_bootstrap.py, scripts/trae_company_review.py, scripts/test_trae_company_review.py, scripts/apply_company_review.py, scripts/test_apply_company_review.py, scripts/test_agent_reclassification.py, reports/cumulative-target-companies.tsv, reports/cumulative-excluded-companies.tsv, company_industries.json, docs/trae-company-review.md, docs/financial-blacklist.md, scripts/jobspy/linkedin_ids.py, scripts/audit_employer_types.py, scripts/company_review_queue.py, scripts/test_company_review_queue.py, scripts/publication_state.py, reports/employer-review-status.json, data/publication-state.json, .github/workflows/validate-financial-blacklist.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Require typed company records and preserve verified history
        run: python scripts/publication_state.py --validate
      - name: Review queue and employer coverage on canonical data
        run: |
          python -I -B scripts/company_review_queue.py > /tmp/company-review-queue.json
          python -I -B scripts/audit_employer_types.py
      - name: Run isolated company review regression suite
        run: python -I -B -c "import sys, unittest; sys.path.insert(0, '.'); unittest.main(module=None, argv=['unittest', 'scripts.test_company_review_queue', 'scripts.test_apply_company_review', 'scripts.test_trae_company_review', 'scripts.test_agent_reclassification'])"
