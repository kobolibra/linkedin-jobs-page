name: Financial blacklist schema

on:
  pull_request:
    paths: [financial_blacklist.json, company_employer_types.json, reclassify.py, scripts/audit_employer_types.py, .github/workflows/validate-financial-blacklist.yml]
  push:
    branches: [main]
    paths: [financial_blacklist.json, company_employer_types.json, reclassify.py, scripts/audit_employer_types.py, .github/workflows/validate-financial-blacklist.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require typed company records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from reclassify import BLACKLIST, blacklist_records

          if Path("company_employer_types.json").exists():
              raise ValueError("Employer classification must use only financial_blacklist.json")
          records = blacklist_records(json.loads(Path(BLACKLIST).read_text(encoding="utf-8")), allow_legacy=False)
          names = {record["company"] for record in records}
          if not names or len(names) != len(records):
              raise ValueError(f"{BLACKLIST} is empty or contains duplicate original names")
          PY
      - name: Audit employer coverage from the protection list only
        run: |
          python scripts/audit_employer_types.py
          python scripts/audit_employer_types.py --pending > /tmp/employer-review-queue.json
