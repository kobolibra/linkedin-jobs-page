name: One-time State Street CN-only canonical repair
on:
  push:
    branches: [main]
    paths:
      - data/jobspy/backfill-requests/state-street-cn-only-fix.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: state-street-authoritative-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install analysis and frontend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-jobspy.txt
      - name: Test CN-only JD policy and exact-source replacement
        env:
          PYTHONPATH: scripts/jobspy
        run: |
          python -m unittest scripts/jobspy/test_repair_state_street_history.py scripts/jobspy/test_state_street.py scripts/jobspy/test_reconcile_full_snapshots.py
      - name: Repair canonical data, rebuild all derived payloads and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            PYTHONPATH=scripts/jobspy python scripts/jobspy/repair_state_street_history.py
            python scripts/posting_event_history.py
            python scripts/jobspy/build_frontend_payload.py --boilerplate data/jev-boilerplate.json
            node --input-type=module -e "import {buildJdShards} from './scripts/build_jd_shards.mjs'; console.log(JSON.stringify(buildJdShards()));"
            PYTHONPATH=scripts/jobspy python - <<'PY'
          import json
          from pathlib import Path
          from repair_state_street_history import is_state
          rows = json.loads(Path('jobs.json').read_text())['jobs']
          state = [r for r in rows if is_state(r)]
          assert len(state) == 142
          assert sum(r['location'] == 'CN' for r in state) == 116
          assert sum(r['location'] == 'HK' for r in state) == 9
          assert sum(r['location'] == 'SG' for r in state) == 17
          assert all(r['pushTime'] == r['datePosted'] and r['firstSeen'] == r['datePosted'] for r in state)
          assert all(r.get('descriptionHtml') or r.get('descriptionText') for r in state if r['location'] == 'CN')
          assert all(not (r.get('descriptionHtml') or r.get('descriptionText')) for r in state if r['location'] != 'CN')
          index = json.loads(Path('jobs-index.json').read_text())
          front = [r for r in index['jobs'] if is_state(r)]
          assert len(front) == 142
          assert all(not r['hasJd'] for r in front if r['location'] != 'CN')
          print('canonical_and_frontend_verified', len(state), len(front))
          PY
            python scripts/audit_project.py --strict
            git add jobs.json jobs-index.json jobs-details.json jobs-version.json data/posting-events-ledger.json data/jev-boilerplate.json
            git add data/jobspy/jobspy_baseline_final_unified.json data/jobspy/state_street_f_c_1767_final.json
            git add data/jobspy/backfill/state-street-live-jd-checkpoint.json data/jobspy/backfill/state-street-initialized.json
            git add docs/state-street-backfill-progress.json docs/state-street-cn-only-repair.json
            git add -A jd-parts
            if git diff --cached --quiet; then
              echo 'Already repaired; nothing to publish'
              exit 0
            fi
            git commit -m 'jobspy: enforce State Street authoritative 142 listings and CN-only JD'
            if git push origin HEAD:main; then
              echo 'Authoritative CN-only history published'
              exit 0
            fi
            if [[ "$attempt" = 5 ]]; then exit 1; fi
            sleep 3
          done
      - name: Deploy repaired canonical jobs
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
