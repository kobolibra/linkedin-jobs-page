name: Verify live list-date hotfix
on:
  push:
    branches: [verify/list-date-production-20261113]
    paths: [.github/workflows/verify-list-date-live.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned production-check browsers
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for exact expected application bytes without changing production
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import hashlib, time
          expected = hashlib.sha256(Path('app.js').read_bytes()).hexdigest()
          url = 'https://linkedin.claudecowork.workers.dev/app.js?v=list-date-shadow-fix-20261113'
          for attempt in range(36):
              try:
                  req = Request(url, headers={'User-Agent': 'NextJourney-Deployment-Verification/1.0', 'Cache-Control': 'no-cache'})
                  with urlopen(req, timeout=15) as response:
                      actual = hashlib.sha256(response.read()).hexdigest()
                  if actual == expected:
                      print('LIVE_APP_SHA256_MATCH', expected)
                      break
                  print('Awaiting published hotfix; current SHA256:', actual[:16], flush=True)
              except Exception as error:
                  print(type(error).__name__, str(error), flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Expected application bundle did not become verifiably live')
          PY
      - name: Verify actual anonymous homepage in Chromium and WebKit
        run: |
          mkdir -p artifacts/live-homepage
          node --input-type=module <<'JS'
          import {chromium,webkit} from 'playwright';
          import assert from 'node:assert/strict';
          import {writeFileSync} from 'node:fs';
          const output=[];
          for(const [engine,type] of [['chromium',chromium],['webkit',webkit]]){
            const browser=await type.launch({headless:true});
            try{
              const context=await browser.newContext({viewport:{width:390,height:844},locale:'zh-CN',timezoneId:'Asia/Shanghai'});
              const page=await context.newPage(),errors=[],renderErrors=[],privateRequests=[];
              page.on('pageerror',e=>errors.push(e.message));
              page.on('console',m=>{if(m.type()==='error'&&m.text().includes('[jobs]'))renderErrors.push(m.text());});
              page.on('request',r=>{if(/\/(?:jobs-index\.json|jobs-version\.json|auth\/preferences)(?:[?]|$)/.test(r.url()))privateRequests.push(r.url());});
              for(let visit=0;visit<2;visit++){
                const response=visit?await page.reload({waitUntil:'domcontentloaded'}):await page.goto('https://linkedin.claudecowork.workers.dev/',{waitUntil:'domcontentloaded'});
                assert.equal(response.status(),200);
                await page.waitForFunction(()=>document.querySelector('#jobs .job')||document.querySelector('#empty.show'),null,{timeout:45000});
                const state=await page.evaluate(()=>({auth:document.documentElement.dataset.authState,rows:document.querySelectorAll('#jobs .job').length,ready:typeof renderReady!=='undefined'&&renderReady,empty:document.querySelector('#empty')?.classList.contains('show'),message:document.querySelector('#empty .big')?.textContent,active:document.querySelector('#activeJobCount')?.textContent,dates:[...document.querySelectorAll('#jobs .day-date')].map(e=>e.textContent),app:[...document.scripts].find(s=>s.src.includes('/app.js?'))?.src,chart:!!document.querySelector('#dist svg'),bars:document.querySelectorAll('#spark .rhythm-bar').length}));
                console.log(JSON.stringify({engine,visit,state,errors,renderErrors}));
                assert.equal(state.auth,'guest');assert.equal(state.ready,true);assert.equal(state.empty,false);
                assert.ok(state.rows>0&&state.rows<=12);assert.equal(state.chart,true);assert.equal(state.bars,30);
                assert.ok(state.app.includes('list-date-shadow-fix-20261113'));
                assert.equal(errors.length,0);assert.equal(renderErrors.length,0);assert.equal(privateRequests.length,0);
                await page.locator('#jobs .job').first().scrollIntoViewIfNeeded();
                await page.screenshot({path:`artifacts/live-homepage/${engine}-${visit}.png`});
                output.push({engine,visit,state,pageErrors:errors.slice(),renderErrors:renderErrors.slice(),privateRequests:privateRequests.slice()});
              }
              await context.close();
            }finally{await browser.close();}
          }
          writeFileSync('artifacts/live-homepage/results.json',JSON.stringify(output,null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-homepage-hotfix-evidence
          path: artifacts/live-homepage
          if-no-files-found: ignore
          retention-days: 7
