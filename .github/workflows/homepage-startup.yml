name: Full homepage startup regression
on:
  pull_request:
    paths:
      - '*.js'
      - '*.css'
      - '*.html'
      - 'jobs-index.json'
      - 'scripts/guest_preview.mjs'
      - 'scripts/test_homepage_startup.mjs'
      - 'scripts/test_startup_date_scope.mjs'
      - 'scripts/test_calendar_axes.mjs'
      - 'scripts/test_canonical_dates.mjs'
      - 'scripts/test_calendar_browser.mjs'
      - 'scripts/assert_region_projections.mjs'
      - 'scripts/test_homepage_interaction.mjs'
      - 'scripts/test_employer_mode_browser.mjs'
      - '.github/workflows/homepage-startup.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'calendar-date.js'
      - 'account.js'
      - 'auth-guest.js'
      - 'list-view.js'
      - 'index.html'
      - 'next-journey-masthead.css'
      - 'account-identity.css'
      - 'scripts/test_employer_mode_browser.mjs'
      - 'scripts/test_homepage_startup.mjs'
      - 'scripts/test_startup_date_scope.mjs'
      - 'scripts/test_calendar_axes.mjs'
      - 'scripts/test_canonical_dates.mjs'
      - 'scripts/test_calendar_browser.mjs'
      - 'scripts/assert_region_projections.mjs'
      - '.github/workflows/homepage-startup.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homepage-startup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  startup:
    # Playwright 1.56.1 browser builds do not support ubuntu26.04-x64.
    # Pin a supported runner instead of relying on ubuntu-latest rollover.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify chart and job-list date scope with regression negative control
        run: node --test scripts/test_startup_date_scope.mjs
      - name: Verify canonical market day across host timezones
        run: |
          TZ=Asia/Shanghai node --test scripts/test_canonical_dates.mjs
          TZ=America/Los_Angeles node --test scripts/test_canonical_dates.mjs
      - name: Verify calendar cadence across timezones, leap day and year boundaries
        run: |
          TZ=Asia/Shanghai node --test scripts/test_calendar_axes.mjs
          TZ=America/Los_Angeles node --test scripts/test_calendar_axes.mjs
      - name: Install pinned Chromium and WebKit test engines
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Boot actual homepage through populated lists with canonical data
        run: node scripts/test_homepage_startup.mjs
      - name: Verify calendar labels and true-height staircase geometry in both engines
        run: node scripts/test_calendar_browser.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate employer scopes from actual canonical data
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
          python scripts/jobspy/build_frontend_payload.py
          python scripts/verify_employer_modes.py
      - name: Verify global employer modes in both browser engines
        run: MODE_BROWSERS=chromium,webkit node scripts/test_employer_mode_browser.mjs
      - name: Verify keyboard, touch, navigation and mobile density in both engines
        run: node scripts/test_homepage_interaction.mjs
      - name: Retain employer mode browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: employer-mode-browser-engines
          path: artifacts/employer-mode
          if-no-files-found: ignore
      - name: Retain homepage startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-startup-browser-evidence
          path: artifacts/homepage-startup
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain homepage interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-interaction-browser-evidence
          path: artifacts/homepage-interaction
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain calendar and regional annotation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calendar-staircase-browser-evidence
          path: artifacts/calendar-axes
          if-no-files-found: ignore
          retention-days: 7
