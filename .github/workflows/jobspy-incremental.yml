name: JobSpy full company snapshots

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: jobspy-public-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch public JobSpy executor
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_EXECUTOR_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            /repos/kobolibra/linkedin-jobs-executor/actions/workflows/run-jobspy.yml/dispatches \
            -f ref=main
          echo "Dispatched public JobSpy executor"
