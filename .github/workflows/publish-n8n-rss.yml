name: Publish n8n RSS into canonical jobs

# Compatibility entry for manual dispatches. Push events are handled only by
# deploy.yml, which owns the entire canonical-publication/deployment sequence.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the serialized publication and deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run deploy.yml --ref main -f force_rss=true
