name: Apply lifecycle hardening once

on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-lifecycle-hardening-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate patch
        run: |
          python scripts/patches/harden_lifecycle_snapshot.py
          python -m py_compile scripts/jobspy/fetch_linkedin_requests.py scripts/jobspy/compact_published_jobs.py
          node --check app.js
          grep -q 'flex:1 1 auto;min-width:0;font-size:12.5px' styles-list.css
          grep -q 'const domainMax=Math.max(50' app.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js styles-list.css scripts/jobspy/fetch_linkedin_requests.py scripts/jobspy/compact_published_jobs.py
          git commit -m "fix: harden snapshots and restore prior UI behavior"
          git push origin HEAD:main
