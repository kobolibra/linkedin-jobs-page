name: Verify completed State Street historical backfill
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify archived CN-only historical result without network requests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          root = Path('data/jobspy/backfill')
          done = json.loads((root / 'state-street-initialized.json').read_text())
          assert done['status'] == 'complete' and done['jdPolicy'].startswith('CN-only')
          rows = json.loads((root / 'state-street-live-jd-checkpoint.json').read_text())['jobs']
          assert len(rows) == 142
          assert Counter(x['location'] for x in rows) == {'CN': 116, 'HK': 9, 'SG': 17}
          assert all(x.get('descriptionHtml') or x.get('descriptionText') for x in rows if x['location'] == 'CN')
          assert all(not (x.get('descriptionHtml') or x.get('descriptionText')) for x in rows if x['location'] != 'CN')
          print('State Street archive verified: 142 listings, 116 CN JD, HK/SG listing only')
          PY
