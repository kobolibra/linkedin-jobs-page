name: Deploy to GitHub Pages and Cloudflare

on:
  push:
    branches: [ main ]
    paths:
      - 'jobs.json'
      - 'jobs-index.json'
      - 'jobs-details.json'
      - 'pv.json'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'avatars/**'
      - 'wrangler.jsonc'
      - 'scripts/visitor-counter.mjs'
      - 'scripts/build_jd_shards.mjs'
      - 'scripts/sync_frontend_payloads.py'
      - 'package.json'
      - 'scripts/verify_visitor_counter.py'
      - 'scripts/deploy_cloudflare.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend payload dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize and verify generated frontend payloads
        run: python scripts/sync_frontend_payloads.py --publish
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "\u0024\u007B\u007B secrets.GITHUB_TOKEN \u007D\u007D"
          publish_dir: ./
      - name: Install pinned Cloudflare deploy CLI
        run: npm install --no-save --package-lock=false wrangler@4.149.0
      - name: Deploy to Cloudflare Worker with bounded transient retries
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: python scripts/deploy_cloudflare.py --attempts 3 --timeout 240
      - name: Verify production visitor counter assets
        run: python scripts/verify_visitor_counter.py
