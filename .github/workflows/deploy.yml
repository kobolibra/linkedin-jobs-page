name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'jobs.json'
      - 'pv.json'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'avatars/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh same-origin visitor count
        run: python3 scripts/publish_pv.py pv.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "\u0024\u007B\u007B secrets.GITHUB_TOKEN \u007D\u007D"
          publish_dir: ./
