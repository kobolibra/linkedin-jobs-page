name: Deploy to GitHub Pages and Cloudflare

on:
  push:
    branches: [ main ]
    paths:
      - 'jobs.json'
      - 'jobs-index.json'
      - 'jobs-details.json'
      - 'pv.json'
      - 'index.html'
      - '*.js'
      - '*.css'
      - 'avatars/**'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frontend payload dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-jobspy.txt
      - name: Build frontend payloads from canonical jobs
        run: python scripts/jobspy/build_frontend_payload.py --boilerplate data/jev-boilerplate.json
      - name: Refresh same-origin visitor count
        run: python3 scripts/publish_pv.py pv.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: "\u0024\u007B\u007B secrets.GITHUB_TOKEN \u007D\u007D"
          publish_dir: ./
      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: "\u0024\u007B\u007B secrets.CLOUDFLARE_API_TOKEN \u007D\u007D"
          accountId: "\u0024\u007B\u007B secrets.CLOUDFLARE_ACCOUNT_ID \u007D\u007D"
          wranglerVersion: "4.143.0"
          command: deploy --config wrangler.jsonc
