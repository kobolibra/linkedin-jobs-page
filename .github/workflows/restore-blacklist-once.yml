name: Restore unauthorized blacklist changes

on:
  push:
    branches: [main]
    paths: [.github/workflows/restore-blacklist-once.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revert unauthorized blacklist commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git revert fe0ec6578ac362b23dbed3f39e000714ca658ccd --no-edit
          git push origin HEAD:main
