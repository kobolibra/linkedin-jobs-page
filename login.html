<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#eff0ef">
  <title>Sign in · LinkedIn 金融职位</title>
  <link rel="stylesheet" href="/auth-login-design.css?v=access-3">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/next-journey-favicon-32.png?v=1" />
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/next-journey-favicon-48.png?v=1" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="/assets/next-journey-mark.svg?v=2" />
  <link rel="mask-icon" href="/assets/next-journey-mark-mono.svg?v=2" color="#10273B" />
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/next-journey-apple-touch-icon.png?v=1" />
  <link rel="manifest" href="/site.webmanifest?v=1" />
  <meta name="apple-mobile-web-app-title" content="Next Journey" />
</head>
<body class="auth-page" data-auth-page="login">
  <a class="auth-skip" href="#signIn">Skip to sign in</a>
  <header class="auth-header">
    <a class="auth-brand" href="/" aria-label="LinkedIn 金融职位首页"><span>LinkedIn 金融职位</span></a>
    
  </header>
  <main class="auth-layout">
    
    <section class="auth-card" id="signIn" aria-labelledby="signInTitle" data-state="loading">
      <div class="auth-card-heading"><h2 id="signInTitle">Sign in</h2><p class="auth-intro" id="authIntro"></p></div>
      <div class="auth-existing" id="authExisting" hidden><span class="auth-existing-dot" aria-hidden="true"></span><span id="authExistingName"></span></div>
      <a class="auth-continue" id="continueBrowsing" href="/" hidden>Continue browsing<span aria-hidden="true">→</span></a>
      <div class="auth-providers"><a class="auth-provider" id="googleLogin" href="/auth/start/google" aria-disabled="true" aria-describedby="authMessage"><svg aria-hidden="true" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.05.97-3.38.97-2.6 0-4.8-1.76-5.59-4.12H3.06v2.59A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.93a6 6 0 0 1 0-3.86V7.48H3.06a10 10 0 0 0 0 9.04l3.35-2.59Z"/><path fill="#EA4335" d="M12 5.95c1.47 0 2.79.5 3.83 1.49l2.87-2.88A9.64 9.64 0 0 0 12 2a10 10 0 0 0-8.94 5.48l3.35 2.59C7.2 7.71 9.4 5.95 12 5.95Z"/></svg><span class="auth-provider-label">Continue with Google</span><span class="auth-provider-spinner" aria-hidden="true"></span></a></div>
      <div class="auth-feedback"><p class="auth-message" id="authMessage" role="status" aria-live="polite" aria-atomic="true"></p><button class="auth-retry" id="authRetry" type="button" hidden>Try again<span aria-hidden="true">↗</span></button></div>
      
      <p class="auth-note">New accounts are created automatically</p>
      <noscript><p class="auth-message">Enable JavaScript to sign in, or <a href="/auth/start/google">continue with Google</a>.</p></noscript>
    </section>
  </main>
  <footer class="auth-footer"><a href="/">Back to roles</a><span aria-hidden="true"> · </span><a href="/privacy">Privacy</a></footer>
  <script src="/auth-login.js?v=access-2"></script>
</body>
</html>
